name: Update live fixtures
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Fetch football fixtures
        run: node scripts/update-fixtures.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Commit generated football data
        run: |
          if git diff --quiet -- fixtures.live.json standings.live.json competitions.live.json; then
            echo "No fixture, standings, or competition metadata changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.live.json standings.live.json competitions.live.json
          git commit -m "Update live football data"
          git push
